name: Clarity contract checks

on:
  push:
    branches:
      - fresh-stacks-rebuild
  pull_request:
    branches:
      - main
      - fresh-stacks-rebuild

jobs:
  clarinet-check:
    runs-on: ubuntu-latest
    container: ghcr.io/stx-labs/clarinet:latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Clarity contracts
        run: clarinet check
      - name: Check Clarity formatting
        run: clarinet fmt --check
