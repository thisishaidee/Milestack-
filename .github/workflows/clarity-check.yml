name: Clarity contract checks

on:
  push:
    branches:
      - fresh-stacks-rebuild
  pull_request:
    branches:
      - main
      - fresh-stacks-rebuild

jobs:
  clarinet-check:
    runs-on: ubuntu-latest
    container: ghcr.io/stx-labs/clarinet:latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Generate temporary local Clarinet settings
        run: |
          mkdir -p "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          clarinet new milestack-ci-template
          mkdir -p "$GITHUB_WORKSPACE/settings"
          cp milestack-ci-template/settings/Devnet.toml "$GITHUB_WORKSPACE/settings/Devnet.toml"
      - name: Validate Clarity contracts
        run: clarinet check
      - name: Enforce canonical Clarity formatting
        run: |
          before="$(sha256sum contracts/*.clar)"
          clarinet format --in-place
          after="$(sha256sum contracts/*.clar)"
          if [ "$before" != "$after" ]; then
            echo "Clarity formatting changes are required. Canonical formatter output follows:"
            for file in contracts/*.clar; do
              echo "===== $file ====="
              cat "$file"
            done
            exit 1
          fi
